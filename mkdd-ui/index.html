<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/api/branding/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#325be4" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MKDD</title>

    <!--
      Fonts, per explicit product requirement:
      - Bodoni Moda: the global header (AppHeader) only.
      - Cormorant Garamond: everything else in the app.
      preconnect hints speed up the actual font fetch that follows.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Applied before React mounts, to avoid a flash of the wrong theme.
      // The CSS's bare :root defaults to LIGHT (per the official token
      // spec), so this must explicitly apply "dark" for the common case
      // too - not just handle a saved "light" preference.
      try {
        var savedTheme = localStorage.getItem("mkdd-theme");
        var theme = savedTheme === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);

        // Keep the browser/PWA chrome color (status bar, and the PWA
        // splash-screen-adjacent theme_color) in sync with the actual
        // theme, not stuck on whatever was hardcoded in the initial
        // <meta theme-color> tag above - see BUGS_AND_FIXES.md #115,
        // where a light-mode-only value there caused a visible light
        // edge specifically in PWA standalone mode (which uses this
        // differently from a normal browser tab) since the app
        // actually defaults to dark.
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute(
            "content",
            theme === "light" ? "#5b53d0" : "#325be4",
          );
        }
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
