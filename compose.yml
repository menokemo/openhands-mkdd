services:
  agent-canvas:
    build:
      context: ./openhands-agent-canvas
      dockerfile: docker/Dockerfile
      args:
        AGENT_SERVER_IMAGE: ${AGENT_SERVER_IMAGE:-ghcr.io/openhands/agent-server:1.40.1-python}
        AUTOMATION_VERSION: ${AUTOMATION_VERSION:-1.6.0}
    image: mkdd/agent-canvas:1.12.0-mkdd2
    container_name: openhands-agent-canvas
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - openhands_state:/home/openhands/.openhands
      - ${MKDD_PROJECTS_DIR:-./projects}:/projects
      - ./company-skills:/home/openhands/.agents/skills:ro
      - ./company-agents-definitions:/home/openhands/.agents/agents
    security_opt:
      - no-new-privileges:true

  mkdd-ui:
    build:
      context: ./mkdd-ui
    container_name: mkdd-ui
    pid: "service:agent-canvas"
    restart: unless-stopped
    environment:
      OPENHANDS_URL: http://agent-canvas:8000
    depends_on:
      - agent-canvas
    ports:
      - "5173:5173"
      - "8787:8787"
    volumes:
      - ./company-agents-definitions:/company-agents-definitions:ro
      - ./mkdd-data:/mkdd-data

volumes:
  openhands_state:
    name: openhands_agent_canvas_state
