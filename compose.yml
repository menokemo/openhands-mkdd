# Every host-facing identifier below (ports, container names, image tag,
# volume name) is parameterized with environment variables, defaulting to
# the original hardcoded values. This means:
#   - Normal / production use (no .env, no vars set): behaves exactly as
#     before, zero change.
#   - Isolated instances (e.g. the auto-deploy staging stack in deploy/,
#     or a manual test like the one done on 2026-08-13 with the
#     mkdd-agent-canvas-TEST container) can override every value via a
#     .env file so they never collide with a production instance running
#     from a different directory.
services:
  agent-canvas:
    build:
      context: ./openhands-agent-canvas
      dockerfile: docker/Dockerfile
      args:
        AGENT_SERVER_IMAGE: ${AGENT_SERVER_IMAGE:-ghcr.io/openhands/agent-server:1.42.1-python}
        AUTOMATION_VERSION: ${AUTOMATION_VERSION:-1.7.1}
    image: ${MKDD_AGENT_CANVAS_IMAGE:-mkdd/agent-canvas:1.15.0-mkdd1}
    container_name: ${MKDD_AGENT_CANVAS_CONTAINER_NAME:-openhands-agent-canvas}
    restart: unless-stopped
    environment:
      # Confirmed root cause of BUGS_AND_FIXES.md #44 (file/image uploads
      # hang forever): entrypoint.sh defaults AUTOMATION_BASE_URL to
      # http://127.0.0.1:$PORT, which is only reachable from inside this
      # exact container - useless for any remote browser (LAN IP,
      # domain, etc.). entrypoint.sh's own comment says explicitly:
      # "Override in production when the external URL differs." Empty
      # default here preserves the old (broken-for-LAN) behavior for
      # anyone who hasn't set it; deployments accessed via a LAN IP MUST
      # set this to http://<that-ip>:<MKDD_AGENT_CANVAS_UI_PORT>.
      AUTOMATION_BASE_URL: ${AUTOMATION_BASE_URL:-}
    ports:
      - "${MKDD_AGENT_CANVAS_PORT:-8000}:8000"
      - "${MKDD_AGENT_CANVAS_UI_PORT:-3000}:3000"
    volumes:
      - openhands_state:/home/openhands/.openhands
      - ${MKDD_PROJECTS_DIR:-./projects}:/projects
      - ./company-skills:/home/openhands/.agents/skills:ro
      - ./company-agents-definitions:/home/openhands/.agents/agents
    security_opt:
      - no-new-privileges:true

  mkdd-ui:
    build:
      context: ./mkdd-ui
    container_name: ${MKDD_UI_CONTAINER_NAME:-mkdd-ui}
    # References the *service* name "agent-canvas" above, not its
    # container_name, so this keeps working correctly even when
    # container names are overridden for an isolated instance.
    pid: "service:agent-canvas"
    restart: unless-stopped
    environment:
      OPENHANDS_URL: http://agent-canvas:8000
      # The container's own name (BUGS_AND_FIXES.md #110), passed in so
      # the app knows exactly what to tell the Docker Engine API to
      # restart via the socket mount below - kept in sync with
      # container_name above rather than hardcoded twice.
      MKDD_UI_CONTAINER_NAME: ${MKDD_UI_CONTAINER_NAME:-mkdd-ui}
    depends_on:
      - agent-canvas
    ports:
      # BUGS_AND_FIXES.md #123: only one port now - the frontend is a
      # real production build served as static files by this same
      # backend process (server/static-files.mjs), not a separate Vite
      # dev server on its own port anymore. Deployments that had NPM
      # forwarding to the old MKDD_UI_PORT (5173/15173) need to update
      # their Forward Port to this one after upgrading.
      - "${MKDD_UI_BACKEND_PORT:-8787}:8787"
      # Live-app preview ports (BUGS_AND_FIXES.md #56): each project gets
      # its own dedicated port from this range (see
      # server/lib/live-port-registry.mjs), reached directly with zero
      # content rewriting. Deliberately NOT independently configurable
      # like the other published ports above - the frontend builds the
      # actual clickable URL directly from the port number an employee
      # shares (the registry's true internal port), so the externally
      # published range MUST match the internal 4001-4020 range exactly,
      # or the frontend-constructed link would point at the wrong port.
      - "4001-4020:4001-4020"
    volumes:
      - ./company-agents-definitions:/company-agents-definitions:ro
      - ./mkdd-data:/mkdd-data
      - ${MKDD_PROJECTS_DIR:-./projects}:/projects
      # Grants the app access to the Docker Engine API so the "Restart
      # now" button in Settings can actually restart this container
      # (BUGS_AND_FIXES.md #110) - e.g. after saving a new allowed
      # domain, which only takes effect on restart. This is a real
      # security tradeoff: Docker socket access is effectively
      # equivalent to root on the host in many configurations. Treat it
      # with the same "known, intentional technical debt" status as the
      # pid: service sharing above (used for the OpenHands session-key
      # discovery workaround) - acceptable for this single-owner,
      # trusted-network deployment model, not something to carry
      # unexamined into a stricter multi-tenant setup.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  openhands_state:
    name: ${MKDD_STATE_VOLUME_NAME:-openhands_agent_canvas_state}
